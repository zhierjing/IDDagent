server:
  port: ${PORT:8081}

spring:
  profiles:
    active: template
  config:
    import:
      - optional:file:backend/.env[.properties]
      - optional:file:.env[.properties]
  webflux:
    static-path-pattern: /h5/**
  web:
    resources:
      static-locations: classpath:/static/
      cache:
        cachecontrol:
          # H5 页面每次请求向后端重新校验，避免浏览器缓存旧版本页面
          no-cache: true

app:
  deepseek:
    api-key: ${DEEPSEEK_API_KEY}
    base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
  model:
    name: ${MODEL_NAME:deepseek-v4-flash}
    coordinator: ${COORDINATOR_MODEL:deepseek-v4-flash}
    follow-up: ${FOLLOW_UP_MODEL:deepseek-v4-flash}
    light: ${LIGHT_MODEL:deepseek-v4-flash}
  jwt:
    secret: ${JWT_SECRET:}
    expire-hours: 24
  data:
    dir: data
  upload:
    dir: static/uploads/account_opening

logging:
  level:
    com.cropagent: DEBUG
